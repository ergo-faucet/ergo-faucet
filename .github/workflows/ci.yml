name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.11
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type Check
        run: npm run type-check

      - name: Depcheck per changed directory using lint-staged
        run: |
          echo "Running depcheck on changed directories using lint-staged"

          CHANGED_FILES=$(npx lint-staged --diff="HEAD~${{ github.event.commits }}" --quiet --relative 2>/dev/null | grep -E '\.(js|jsx|ts|tsx|json)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant changed files detected"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # اجرای depcheck روی دایرکتوری‌های یکتا که package.json دارند
          for dir in $(echo "$CHANGED_FILES" | xargs -n1 dirname | sort -u); do
            if [ -f "$dir/package.json" ]; then
              echo "Running depcheck in $dir"
              cd "$dir" && npx depcheck . && cd -
            else
              echo "Skipping $dir (no package.json)"
            fi
          done

      - name: Run Tests
        run: npm run test

  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.11
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check for Changeset
        run: |
          # Use the official changeset CLI to check for required changesets
          # This will exit with error if there are no changesets for changes since the base branch
          npx @changesets/cli status --since=origin/${{ github.base_ref }}
