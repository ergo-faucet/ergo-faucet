services:
  ergo-faucet:
    build:
      context: ../..
      dockerfile: services/faucet-service/Dockerfile
    image: ergo-faucet
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FAUCET_PORT}:3000'
    env_file:
      - .env
    volumes:
      - ./services/faucet-service/logs:/app/services/faucet-service/logs
    depends_on:
      - postgres
      - redis
    networks:
      - faucet-network

  postgres:
    image: postgres:14
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - faucet-network

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - faucet-network

volumes:
  postgres_data:
  redis_data:

networks:
  faucet-network:
    driver: bridge
