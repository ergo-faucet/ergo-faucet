services:
  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - faucet-network

volumes:
  postgres_data:
  redis_data:

networks:
  faucet-network:
    driver: bridge
