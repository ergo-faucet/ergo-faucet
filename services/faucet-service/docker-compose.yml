services:
  ergo-faucet:
    image: ghcr.io/ergo-faucet/ergo-faucet:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FAUCET_PORT}:3000'
    env_file:
      - .env
    volumes:
      - ./logs:/app/services/faucet-service/logs
      - type: 'bind'
        source: ./config/local.yaml
        target: /app/services/faucet-service/config/local.yaml

    depends_on:
      - postgres
      - redis
    networks:
      - faucet-network

  postgres:
    image: postgres:17.0
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - faucet-network

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - faucet-network

volumes:
  postgres_data:
  redis_data:

networks:
  faucet-network:
    driver: bridge
