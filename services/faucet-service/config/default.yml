# logging configuration
logs:
  - type: 'file'
    path: './logs/'
    maxSize: '20m'
    maxFiles: '14d'
    level: 'info'
  - type: 'console'
    level: 'info'

recaptcha:
  key: ''
  threshold: 0.5
  hostnames:
    - 'localhost'

server:
  port: 3000
  host: '0.0.0.0'
  corsOrigins: '*'
  jwtSecret: ''
  jwtExpiration: 86400
  activeFastifyLogger: true
  swagger:
    openapi:
      info:
        title: 'Faucet Service API'
        description: 'API documentation for Faucet Service'
        version: '1.0.0'
    swaggerUi:
      routePrefix: '/docs'
      uiConfig:
        docExpansion: 'none'
        deepLinking: false
  cookie:
    secret: ''
    signed: true
    name: 'refreshToken'
    httpOnly: true
    secure: false
    sameSite: 'lax'
    path: '/'
    domain: 'localhost'

database:
  type: 'postgres'
  path: ''
  host: 'localhost'
  port: 5432
  username: 'faucet_user'
  password: ''
  database: 'faucet_db'
  logging: false

redis:
  host: 'localhost'
  port: 6379
  password: ''

ergoAuth:
  challengeExpirySeconds: 300
  refreshTokenExpirySeconds: 2592000
  accessTokenExpirySeconds: 3600
  networkAddress: 'Testnet'

discord:
  clientID: 'your-discord-client-id'
  clientSercret: ''
  redirectURL: 'http://localhost:3000/auth/discord/callback'
  scope: 'identify email'
  expiresTime: 7200

x-platform:
  clientID: 'your-x-client-id'
  clientSecret: ''
  redirectURL: 'http://localhost:3000/auth/x-platform/callback'
  scope: 'read write'
  expiresTime: 7200
  sessionTTL: 3600
